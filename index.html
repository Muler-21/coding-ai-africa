<style>
/* Layout idea: a sticky top bar, a left "ladder" navigation of the 9 levels, and a reading column; each level page is one card stack. */
:root{
  --bg:#F5F7F2;
  --surface:#FFFFFF;
  --ink:#18221C;
  --muted:#55625A;
  --line:#D8DED4;
  --accent:#1E6B47;
  --accent-soft:#E2EFE7;
  --gold:#A8701A;
  --gold-soft:#F6EAD3;
  --good:#2F7D4F;
  --font-display:'Bricolage Grotesque','Noto Sans Ethiopic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Noto Sans','Noto Sans Ethiopic',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612;--surface:#17211B;--ink:#E7EEE9;--muted:#A2B0A7;--line:#2A372F;
    --accent:#5BC28E;--accent-soft:#1B3125;--gold:#E2B45C;--gold-soft:#3A2E18;--good:#6CCB95;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612;--surface:#17211B;--ink:#E7EEE9;--muted:#A2B0A7;--line:#2A372F;
  --accent:#5BC28E;--accent-soft:#1B3125;--gold:#E2B45C;--gold-soft:#3A2E18;--good:#6CCB95;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.4vw,42px);font-weight:700}
h2{font-size:24px;font-weight:700}
h3{font-size:18px;font-weight:600}
p{margin:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:18px}
.brand-mark{width:30px;height:30px;flex:none}
.spacer{flex:1}
.btn{text-decoration:none;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.menu-btn{display:none}
.lang .short{display:none}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1200px;margin:0 auto}
nav.side{position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow-y:auto;padding:20px 12px 40px;border-right:1px solid var(--line)}
.nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.nav-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 10px 6px}
.nav-link{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px}
.nav-link:hover{background:var(--accent-soft)}
.nav-link[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.nav-num{display:inline-grid;place-items:center;min-width:24px;padding:0 3px;height:24px;border-radius:6px;border:1px solid var(--line);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.nav-link[aria-current="page"] .nav-num{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.nav-pct{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
main{padding:28px 32px 80px;min-width:0}
.col{max-width:860px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.card.accent{border-color:var(--accent);background:var(--accent-soft)}
.card.gold{border-color:var(--gold);background:var(--gold-soft)}
.lead{font-size:18px;color:var(--ink);max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip strong{color:var(--ink);font-weight:600}
.eyebrow{font-size:13px;font-weight:600;color:var(--gold);letter-spacing:.04em;text-transform:uppercase}
ul.clean,ol.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rung{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink)}
.rung:hover{border-color:var(--accent)}
.rung-top{display:flex;align-items:center;gap:10px}
.rung-n{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.rung-name{font-weight:600}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--good)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.check label{cursor:pointer}
.check.done label{color:var(--muted)}
.hero-level{display:flex;gap:18px;align-items:flex-start}
.big-n{font-family:var(--font-display);font-size:72px;line-height:.9;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.filter{display:flex;flex-wrap:wrap;gap:6px}
.filter button{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
textarea{width:100%;min-height:80px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.note{font-size:14px;padding:10px 12px;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 8px 8px 0}
.status{font-size:14px;color:var(--good);min-height:1.4em}
.author dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
.author dt{color:var(--muted);font-size:14px}
.author dd{margin:0}
svg.cycle{width:100%;height:auto;display:block}
footer.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
details.mod{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.mod+details.mod{margin-top:10px}
details.mod>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px}
details.mod>summary::-webkit-details-marker{display:none}
details.mod>summary:hover{background:var(--accent-soft);border-radius:10px}
details.mod[open]>summary{border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.mod-n{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.mod-title{font-weight:600;flex:1}
.mod-dur{font-size:13px;color:var(--muted);text-align:right}
.mod-caret{color:var(--muted);transition:transform .15s}
details.mod[open] .mod-caret{transform:rotate(90deg)}
.mod-body{padding:14px 16px 16px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.mod-body h4{margin:0 0 6px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
.mod-body ol,.mod-body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.mod-act{padding:10px 12px;border-radius:8px;background:var(--gold-soft);border-left:3px solid var(--gold)}
.mod-tip{font-size:14px;color:var(--muted)}
.mod-tools{display:flex;justify-content:flex-end}
.ex{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.ex+.ex{margin-top:16px}
.ex-head{padding:14px 16px;background:var(--accent-soft);display:grid;gap:4px}
.ex-head h3{font-size:17px}
.ex-body{padding:14px 16px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.ex,.card,.col>*{min-width:0}
.ex-body h4{margin:0 0 6px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
.ex-meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:15px}
.ex-meta dt{color:var(--muted)}
.ex-meta dd{margin:0}
.ex th,.ex td{padding:5px 8px}
pre.code{margin:0;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
pre.out{border-left:3px solid var(--good)}
details.code-box>summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0;display:flex;gap:10px;align-items:center}
.copy-row{display:flex;justify-content:flex-end;margin-bottom:6px}
.btn.sm{font-size:12.5px;padding:4px 10px}
/* ---------- charts (palette validated for CVD on both surfaces) ---------- */
:root{--v1:#2a78d6;--v2:#eb6834;--v3:#1baf7a;--v0:#b4bdb6;--vgrid:#eceee9;--vaxis:#c3cbc2}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--v1:#3987e5;--v2:#d95926;--v3:#199e70;--v0:#4f5e55;--vgrid:#223029;--vaxis:#3a4a41} }
:root[data-theme="dark"]{--v1:#3987e5;--v2:#d95926;--v3:#199e70;--v0:#4f5e55;--vgrid:#223029;--vaxis:#3a4a41}
.vizset{display:grid;gap:12px}
.viz{margin:0;display:grid;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.viz figcaption{display:grid;gap:3px}
.viz figcaption strong{font-size:15px;line-height:1.35}
.viz figcaption .small{line-height:1.45}
.vizlegend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.vizlegend span{display:inline-flex;align-items:center;gap:6px}
.lk{display:inline-block;flex:none;background:var(--c)}
.lk.line{width:16px;height:2px;border-radius:1px}
.lk.dot{width:9px;height:9px;border-radius:50%}
.lk.dot.sq{border-radius:2px}
.lk.ring{width:9px;height:9px;border-radius:50%;background:transparent;border:2px solid var(--c)}
.lk.rect{width:12px;height:10px;border-radius:2px}
.c0{--c:var(--v0)}.c1{--c:var(--v1)}.c2{--c:var(--v2)}.c3{--c:var(--v3)}
.vizplot{min-width:0}
.vizplot svg{display:block;max-width:100%;overflow:visible}
svg.vz text{font-family:var(--font-body);font-size:12px;fill:var(--muted)}
svg.vz text.axt{font-size:12.5px}
svg.vz text.cat{fill:var(--ink);font-size:12.5px}
svg.vz text.val{fill:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}
svg.vz text.lab{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
svg.vz .grid{stroke:var(--vgrid);stroke-width:1}
svg.vz .axis{stroke:var(--vaxis);stroke-width:1}
svg.vz .ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;fill:none}
svg.vz .leader{stroke:var(--muted);stroke-width:1}
svg.vz .ln{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.vz .ln.mute{stroke-width:1.5}
svg.vz .band{fill:var(--c);opacity:.14;stroke:none}
svg.vz .pt{fill:var(--c);stroke:var(--surface);stroke-width:2}
svg.vz .pt.thin{stroke-width:.75}
svg.vz .pt.hollow{fill:var(--surface);stroke:var(--c);stroke-width:2}
svg.vz .whisk{stroke:var(--c);stroke-width:2;stroke-linecap:round}
svg.vz .bar,svg.vz .segb{fill:var(--c)}
svg.vz text.inseg{fill:#fff;font-size:13px;font-weight:600}
svg.vz text.inseg.dark{fill:var(--ink)}
svg.vz .hit{fill:transparent;stroke:none;cursor:default}
svg.vz .hit:hover,svg.vz .hit:focus{stroke:var(--ink);stroke-width:1.5;outline:none}
svg.vz .hitrow,svg.vz .hitbar{fill:transparent}
svg.vz .hitrow:hover,svg.vz .hitrow:focus{fill:var(--ink);fill-opacity:.05;outline:none}
svg.vz .hitbar:hover,svg.vz .hitbar:focus{fill:var(--ink);fill-opacity:.08;outline:none}
#vtip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.14);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.35;display:none;max-width:280px}
#vtip b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
#vtip span{color:var(--muted)}
.viztable summary{cursor:pointer;font-size:13.5px;color:var(--accent);font-weight:600}
.viztable .tablewrap{max-height:340px;overflow:auto;margin-top:6px}
.qggrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr))}
.qgcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;align-content:start;min-width:0;scroll-margin-top:72px}
.qgcard h3{font-size:17px;margin:0}
.qgcard h4{margin:4px 0 0;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
.qgcard p{margin:0}
.fx{font-family:'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif;font-size:17.5px;line-height:2;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:8px 12px;overflow-x:auto;white-space:nowrap}
@media (max-width:560px){.fx{font-size:15.5px}}
.fx var{font-style:italic}
.fx b{font-weight:700}
dl.sym{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:0;font-size:14.5px}
dl.sym dt{font-family:'Cambria Math','Times New Roman',serif;font-style:italic;font-weight:600}
dl.sym dd{margin:0;color:var(--muted)}
.qgtoc{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.qgtoc a{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;background:var(--surface)}
#qgsim{scroll-margin-top:72px}
.simgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));margin:6px 0 10px}
.sliders{display:grid;gap:10px}
.sl{display:grid;gap:2px;font-size:14px}
.sl span{display:flex;justify-content:space-between;gap:8px}
.sl output{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.sl input{width:100%;accent-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-content:start}
.tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px;background:var(--surface)}
.tile strong{font-size:22px;line-height:1.2}
.ex{scroll-margin-top:72px}
.modgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.modcard{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
.modcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mc-dur{font-size:12px;color:var(--muted);text-align:right}
.mc-title{font-family:var(--font-display);font-size:17px;line-height:1.3}
.mc-out{font-size:14px;color:var(--muted);line-height:1.45}
.mc-meta{font-size:12.5px;color:var(--gold);margin-top:auto}
.mc-go{font-size:13.5px;color:var(--accent);font-weight:600}
.crumbs a{color:var(--accent)}
.big-n.unit-n{font-size:clamp(40px,8vw,72px)}
.mtiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mtiles .tile strong{font-size:16px;line-height:1.35}
ul.outs{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.outs li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--accent-soft)}
ul.outs li span{color:var(--accent);font-weight:700}
ol.lpath{list-style:none;padding:0;margin:0;position:relative;display:grid;gap:10px}
ol.lpath:before{content:"";position:absolute;left:15px;top:16px;bottom:16px;width:2px;background:var(--line)}
ol.lpath li{display:flex;gap:12px;align-items:flex-start;position:relative}
.lp-n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:14px;z-index:1}
ol.lpath li div{padding:5px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex:1}
.h4g{margin:10px 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
.qa{display:grid;gap:8px}
.qa details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
.qa summary{cursor:pointer;font-weight:600}
.qa details p{margin:8px 0 2px;padding-left:10px;border-left:3px solid var(--accent)}
.dgset{display:grid;gap:14px}
figure.dg{margin:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:grid;gap:10px;min-width:0}
figure.dg figcaption{font-weight:700;font-size:15px}
.dg-node{border:1.5px solid var(--accent);background:var(--surface);border-radius:10px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.dg-node strong{font-size:14.5px;line-height:1.3}
.dg-node span{font-size:12.5px;color:var(--muted);line-height:1.35}
.dg-node.hl{background:var(--accent);border-color:var(--accent)}
.dg-node.hl strong,.dg-node.hl span{color:var(--surface)}
.dg-node.root{border-width:2px;background:var(--accent-soft)}
.dg-flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;row-gap:10px}
.dg-flow .dg-node{flex:1 1 120px}
.dg-arrow{flex:none;width:22px;align-self:center;display:grid;place-items:center}
.dg-arrow:after{content:"→";color:var(--accent);font-weight:700;font-size:18px}
.dg-loop{font-size:13px;color:var(--accent);font-weight:600;padding:4px 10px;border:1.5px dashed var(--accent);border-radius:999px;justify-self:start}
.dg-cycle{display:flex;flex-wrap:wrap;gap:10px 0;align-items:center}
.dg-cnode{display:flex;align-items:center;flex:1 1 140px}
.dg-cnode .dg-node{flex:1}
.dg-stack{display:grid;gap:4px}
.dg-layer{padding:8px 12px;border-radius:8px;display:grid;gap:2px;border-left:5px solid var(--v1);background:var(--surface)}
.dg-layer.l1{border-left-color:var(--v2)}.dg-layer.l2{border-left-color:var(--v3)}.dg-layer.l3{border-left-color:var(--gold)}
.dg-layer strong{font-size:14.5px}.dg-layer span{font-size:12.5px;color:var(--muted)}
.dg-tree ul{list-style:none;margin:0;padding:0}
.dg-tree>ul>li>ul{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;padding-top:10px;border-top:2px solid var(--line)}
.dg-tree>ul>li>ul>li{flex:1 1 140px;display:grid;gap:6px;align-content:start}
.dg-tree>ul>li>ul>li>ul{display:grid;gap:6px;padding-left:12px;border-left:2px solid var(--line)}
.dg-node.small strong{font-size:13.5px}
.dg-compare{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.dg-col{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);border-top:4px solid var(--v1)}
.dg-col.bad{border-top-color:var(--v2)}.dg-col.good{border-top-color:var(--v3)}
.dg-col ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.dg-verdict{margin:0;font-weight:600}
.dg-blocks{display:grid;gap:3px;justify-items:start}
.blk{border-radius:8px;color:#fff;font-size:14px;font-weight:600;min-width:180px;max-width:100%}
.blk>span{display:block;padding:6px 12px}
.blk-in{margin-left:16px;padding:3px 0;display:grid;gap:3px;background:var(--bg);border-radius:0 6px 6px 0}
.blk-end{height:12px}
.blk.event{background:#a8701a}.blk.motion{background:#2a63b8}.blk.control{background:#b85a14}.blk.looks{background:#6a4fc8}.blk.sound{background:#a83d82}.blk.data{background:#b5502d}.blk.operator{background:#2f7d4f}.blk.sensing{background:#1f7f95}
.dg-grid{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.dg-grid svg{max-width:100%;height:auto}
.dg-grid .gcell{fill:var(--surface);stroke:var(--line)}
.dg-grid .gwall{fill:var(--v0)}
.dg-grid .ggoal{fill:var(--gold)}
.dg-grid .gpath{fill:none;stroke:var(--v1);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.dg-grid .gstep{fill:var(--v1)}
.dg-grid .gbot{fill:var(--v2)}
.dg-grid .gnose{fill:#fff}
.dg-grid .gbump{font-size:22px;fill:var(--v2);font-weight:700}
.cards{display:flex;flex-wrap:wrap;gap:6px}
.acard{display:grid;justify-items:center;width:64px;padding:6px 2px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.acard b{font-size:22px;line-height:1;color:var(--accent)}
.acard small{font-size:10.5px;color:var(--muted);text-align:center}
.dg-grid p.ok{color:var(--good);font-weight:600}.dg-grid p.warn{color:var(--v2);font-weight:600}
main p,main li,main dd,.dg-node,.dg-col{overflow-wrap:break-word}
.decide{padding:10px 12px;border-radius:8px;background:var(--accent-soft);border-left:3px solid var(--accent)}
.bizline{padding:10px 12px;border-radius:8px;background:var(--gold-soft);border-left:3px solid var(--gold);font-size:15px}
.tag-s{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  nav.side{display:none;position:fixed;top:57px;left:0;right:0;bottom:0;height:auto;background:var(--surface);z-index:15;border-right:0}
  nav.side.open{display:block}
  .menu-btn{display:inline-block}
  .topbar{gap:8px;padding:10px 12px}
  .brand{font-size:15px}
  .brand-mark{width:26px;height:26px}
  .lang .long{display:none}
  .lang .short{display:inline}
  main{padding:20px 16px 64px}
  .big-n{font-size:52px}
}
html[lang="am"] body{font-size:17px;line-height:1.75}
html[lang="am"] .small,html[lang="am"] table{font-size:15px}
html[lang="am"] .nav-link{font-size:15.5px}
@media (prefers-reduced-motion:no-preference){.rung,.btn,.nav-link{transition:border-color .15s,background .15s}}
</style>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const itemKeys = n => ['p0','p1','p2','sig','exit'].map(k => 'L'+n+'-'+k);
function levelPct(n){ const ks = itemKeys(n); const d = ks.filter(k => state.progress[k]).length; return Math.round(100*d/ks.length); }
function levelName(L){ return state.lang==='am' ? L.am : L.name; }

/* ---------- views ---------- */
function cycleSVG(){
  const am = isAm(), names = am?CYCLE.am:CYCLE.en, lines = am?CYCLE.am2:CYCLE.en2;
  const xs=[104,288,472,656];
  let s = `<svg class="cycle" viewBox="0 0 760 200" role="img" aria-label="${esc(names.join(', '))}"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><g fill="none" stroke="var(--muted)" stroke-width="1.25">`;
  for(let i=0;i<3;i++) s += `<path d="M${xs[i]+80} 72H${xs[i+1]-80}" marker-end="url(#ar)"/>`;
  s += `<path d="M656 108V150H104V108" marker-end="url(#ar)"/></g>`;
  xs.forEach((x,i)=>{ const main=i===3;
    s += `<rect x="${x-80}" y="36" width="160" height="72" rx="8" fill="${main?'var(--accent-soft)':'var(--surface)'}" stroke="${main?'var(--accent)':'var(--line)'}" stroke-width="${main?2:1.25}"/>
      <text x="${x}" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="var(--font-display)">${esc(names[i])}</text>
      <text x="${x}" y="78" text-anchor="middle" font-size="11.5" fill="var(--muted)">${esc(lines[i][0])}</text>
      <text x="${x}" y="94" text-anchor="middle" font-size="11.5" fill="var(--muted)">${esc(lines[i][1])}</text>`; });
  s += `<text x="380" y="174" text-anchor="middle" font-size="11.5" fill="var(--muted)">${esc(am?CYCLE.loopAm:CYCLE.loopEn)}</text></svg>`;
  return s;
}

function qnorm(p){ // Acklam's inverse normal CDF
  const a=[-39.6968302866538,220.946098424521,-275.928510446969,138.357751867269,-30.6647980661472,2.50662827745924],
        b=[-54.4760987982241,161.585836858041,-155.698979859887,66.8013118877197,-13.2806815528857],
        c=[-0.00778489400243029,-0.322396458041136,-2.40075827716184,-2.54973253934373,4.37466414146497,2.93816398269878],
        d=[0.00778469570904146,0.32246712907004,2.445134137143,3.75440866190742], pl=0.02425;
  let q,r;
  if(p<pl){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p>1-pl){ q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q=p-0.5; r=q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
function bindQG(){
  const ids=['h2','p','sd','mu','L'], el=id=>document.getElementById('s-'+id);
  if(!el('h2')) return;
  const S = pick(QG.sim), dens = (x,m,s)=>Math.exp(-0.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
  const f2 = v => v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  function draw(){
    const v = Object.fromEntries(ids.map(k=>[k, +el(k).value]));
    document.getElementById('o-h2').textContent = f2(v.h2);
    document.getElementById('o-p').textContent = Math.round(v.p*100)+'%';
    document.getElementById('o-sd').textContent = v.sd.toFixed(1);
    document.getElementById('o-mu').textContent = v.mu.toFixed(1);
    document.getElementById('o-L').textContent = v.L.toFixed(1);
    const z = qnorm(1-v.p), i = dens(z,0,1)/v.p, Sd = i*v.sd, R = v.h2*Sd, Ry = R/v.L;
    const tile = (lab,val,unit)=>`<div class="tile"><span class="small muted">${esc(lab)}</span><strong>${val}</strong>${unit?`<span class="small muted">${unit}</span>`:''}</div>`;
    document.getElementById('simTiles').innerHTML = tile(S.i,f2(i),'')+tile(S.S,f2(Sd),'kg')+tile(S.R,f2(R),'kg')+tile(S.Ry,f2(Ry),'kg')+tile(S.R10,f2(10*Ry),'kg');
    const box = document.getElementById('simPlot'), W = Math.max(260, box.clientWidth), H = 230, m = {l:12,r:12,t:28,b:42};
    const x0 = v.mu-4*v.sd, x1 = v.mu+4*v.sd+R, X = x=>m.l+(x-x0)/(x1-x0)*(W-m.l-m.r), top = dens(v.mu,v.mu,v.sd)*1.05, Y = y=>H-m.b-(y/top)*(H-m.b-m.t);
    const pts = (mu,a,b)=>{ const o=[]; for(let k=0;k<=160;k++){ const x=a+(b-a)*k/160; o.push(`${X(x).toFixed(1)},${Y(dens(x,mu,v.sd)).toFixed(1)}`);} return o; };
    const cut = v.mu+z*v.sd, tail = pts(v.mu, cut, x1);
    let g = '';
    const step = (()=>{ const raw=(x1-x0)/5, p10=Math.pow(10,Math.floor(Math.log10(raw))), e=raw/p10; return (e>=5?5:e>=2?2:1)*p10; })();
    for(let tk=Math.ceil(x0/step)*step; tk<=x1; tk+=step) g += `<line class="grid" x1="${X(tk)}" x2="${X(tk)}" y1="${m.t}" y2="${H-m.b}"/><text x="${X(tk)}" y="${H-m.b+16}" text-anchor="middle">${+tk.toFixed(2)}</text>`;
    g += `<line class="axis" x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/><text class="axt" x="${W/2}" y="${H-6}" text-anchor="middle">${esc(S.x)} (kg)</text>`;
    g += `<path class="c1" style="fill:var(--c);opacity:.32" d="M${X(cut)},${Y(0)}L${tail.join('L')}L${X(x1)},${Y(0)}Z"/>`;
    g += `<path class="ln c1" d="M${pts(v.mu,x0,x1).join('L')}"/><path class="ln c2" d="M${pts(v.mu+R,x0,x1).join('L')}"/>`;
    const marks = [[v.mu,'μ',0],[v.mu+Sd,'μ + S',1],[v.mu+R,'μ + R',2]];
    marks.forEach(([x,lab,k])=>{ g += `<line class="ref" x1="${X(x)}" x2="${X(x)}" y1="${m.t-4+k*0}" y2="${H-m.b}"/>`; });
    const lx = marks.map(([x])=>X(x)); const ly=[m.t-10,m.t-10,m.t-10];
    if(Math.abs(lx[2]-lx[0])<46) ly[2]=m.t+6; if(Math.abs(lx[1]-lx[2])<46) ly[1]=m.t+(ly[2]===m.t+6?22:6);
    marks.forEach(([x,lab],k)=>{ g += `<text class="lab" x="${lx[k]}" y="${ly[k]}" text-anchor="middle">${lab}</text>`; });
    box.innerHTML = `<svg class="vz" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(pick(QG.simT))}">${g}</svg>`;
  }
  ids.forEach(k=>el(k).addEventListener('input',draw));
  window.addEventListener('resize', ()=>{ if(document.getElementById('simPlot')) draw(); });
  draw();
}

/* ---------- router ---------- */
window.APPI = {pick: x => pick(x), t: k => t(k)};
function route(){
  const [h, anchor] = (location.hash||'#home').slice(1).split('/');
  let html, r = h;
  if(/^level-[0-8]$/.test(h)) html = viewLevel(+h.split('-')[1]);
  else if(h==='stats') html = viewStatsHome();
  else if(/^stats-[0-8]$/.test(h)) html = viewStatsLevel(+h.split('-')[1]);
  else if(h==='qg') html = viewQG();
  else if(/^unit-[0-8]-\d+-\d+$/.test(h)){ const [,a,b,c] = h.split('-'); html = viewUnit(+a,+b,+c); r = 'level-'+a; }
  else if(/^mod-[0-8]-\d+$/.test(h)){ const [,a,b] = h.split('-'); html = viewModule(+a,+b); r = 'level-'+a; }
  else if(h==='business') html = viewBusiness();
  else if(h==='tracks') html = viewTracks();
  else if(h==='resources') html = viewResources();
  else if(h==='progress') html = viewProgress();
  else if(h==='certificates') html = viewCerts();
  else if(h==='about') html = viewAbout();
  else { html = viewHome(); r='home'; }
  const main = document.getElementById('main');
  main.innerHTML = html + `<footer class="foot"><span>© 2026 Mulusew Kassa Bitew</span><a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">${esc(t('license'))}: CC BY-NC 4.0</a><a href="#about">${esc(t('about'))}</a><a href="https://github.com/Muler-21" target="_blank" rel="noopener">GitHub @Muler-21</a></footer>`;
  renderNav(r);
  document.getElementById('sideNav').classList.remove('open');
  document.getElementById('menuBtn').setAttribute('aria-expanded','false');
  bindView();
  if(h==='qg') bindQG();
  if(window.drawViz) drawViz();
  const target = anchor && document.getElementById(anchor);
  if(target) requestAnimationFrame(() => target.scrollIntoView({block:'start'}));
  return !!target;
}

function setStatus(id,msg){ const el=document.getElementById(id); if(el) el.textContent=msg; }

function bindView(){
  document.querySelectorAll('input[data-key]').forEach(cb=>cb.addEventListener('change',e=>{
    const k=e.target.dataset.key; if(e.target.checked) state.progress[k]=true; else delete state.progress[k];
    save('progress',state.progress); e.target.closest('.check').classList.toggle('done',e.target.checked);
    const h=(location.hash||'').slice(1); renderNav(h);
  }));
  document.querySelectorAll('[data-res]').forEach(b=>b.addEventListener('click',()=>{ state.resFilter=b.dataset.res; route(); }));
  const copy = document.getElementById('copyCode');
  if(copy) copy.addEventListener('click',()=>{
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(state.progress))));
    const box = document.getElementById('codeBox'); box.value = code;
    try{ navigator.clipboard.writeText(code).then(()=>setStatus('progStatus',t('copied')),()=>{ box.select(); setStatus('progStatus',t('copyBlocked')); }); }
    catch(e){ box.select(); setStatus('progStatus',t('copyBlocked')); }
  });
  const loadBtn = document.getElementById('loadCode');
  if(loadBtn) loadBtn.addEventListener('click',()=>{
    const v=document.getElementById('codeBox').value.trim();
    try{ const obj=JSON.parse(decodeURIComponent(escape(atob(v)))); if(typeof obj!=='object'||Array.isArray(obj)) throw 0;
      state.progress={}; Object.keys(obj).forEach(k=>{ if(/^L[0-8]-(p[0-2]|sig|exit)$/.test(k)&&obj[k]) state.progress[k]=true; });
      save('progress',state.progress); route(); setStatus('progStatus',t('loaded')); }
    catch(e){ setStatus('progStatus',t('badCode')); }
  });
  const reset = document.getElementById('resetProg');
  if(reset) reset.addEventListener('click',()=>{
    if(reset.dataset.armed){ state.progress={}; save('progress',state.progress); route(); setStatus('progStatus',t('cleared')); }
    else { reset.dataset.armed='1'; reset.textContent=t('resetConfirm'); }
  });
  document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{
    const el=document.getElementById(b.dataset.copy); const txt=el?el.textContent:'';
    const ok=()=>{b.textContent=t('copied2');}, bad=()=>{ try{const r=document.createRange(); r.selectNodeContents(el); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);}catch(e){} b.textContent=t('copyFail'); };
    try{ navigator.clipboard.writeText(txt).then(ok,bad); }catch(e){ bad(); }
  }));
  const tg = document.getElementById('toggleMods');
  if(tg) tg.addEventListener('click',()=>{ const open = tg.dataset.open!=='1';
    document.querySelectorAll('details.mod').forEach(d=>d.open=open); tg.dataset.open=open?'1':'0'; tg.textContent=t(open?'closeAll':'openAll'); });
  const cite = document.getElementById('copyCite');
  if(cite) cite.addEventListener('click',()=>{
    const txt=document.getElementById('citeText').textContent;
    try{ navigator.clipboard.writeText(txt).then(()=>setStatus('citeStatus',t('citeCopied')),()=>setStatus('citeStatus',t('citeBlocked'))); }
    catch(e){ setStatus('citeStatus',t('citeBlocked')); }
  });
}

function setLang(l){
  state.lang=l; save('lang',l);
  document.documentElement.lang = l==='am'?'am':'en';
  document.getElementById('langEn').setAttribute('aria-pressed',String(l==='en'));
  document.getElementById('langAm').setAttribute('aria-pressed',String(l==='am'));
  document.getElementById('brandText').textContent = t('brand');
  document.getElementById('menuBtn').textContent = t('menu');
  route();
}

document.getElementById('langEn').addEventListener('click',()=>setLang('en'));
document.getElementById('langAm').addEventListener('click',()=>setLang('am'));
document.getElementById('menuBtn').addEventListener('click',e=>{
  const nav=document.getElementById('sideNav'); const open=nav.classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded',String(open));
});
window.addEventListener('hashchange',()=>{ if(!route()) window.scrollTo(0,0); });
setLang(state.lang==='am'?'am':'en');

})();
